<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陪一把 · 数字孪生演示 | 养老陪伴机器人 Galbot G1</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22e6; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950;
    --warn:#d29922; --alarm:#f85149;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--fg)}
  #app{position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}

  /* ── 房间标注（CSS2D） ── */
  .room-tag{background:#0008;color:#fff;padding:2px 10px;border-radius:12px;
    font-size:14px;letter-spacing:2px;border:1px solid #fff3;white-space:nowrap}

  /* ── 语音气泡 / 胸部屏幕（CSS2D） ── */
  .bubble{background:#fffcf4f0;color:#222;padding:4px 10px;border-radius:8px;font-size:12px;
    max-width:200px;box-shadow:0 2px 8px #0006;position:relative;white-space:nowrap}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble.elderly{background:#ffe9c9}
  .bubble.elderly::after{border-top-color:#ffe9c9}
  .bubble.emote{background:#0b1d33ee;color:#7ee787;border:1.5px solid #2f81f7;font-size:13px}
  .bubble.emote::after{border-top-color:#0b1d33}
  .bubble.emote[data-level="alarm"]{color:#ffb3ad;border-color:#f85149}
  .chest-screen{background:#0b1d33;border:2px solid #2f81f7;border-radius:6px;color:#7ee787;
    font-size:12px;padding:4px 8px;white-space:nowrap;box-shadow:0 0 10px #2f81f788}
  .chest-screen.alarm{color:#ffb3ad;border-color:#f85149;box-shadow:0 0 12px #f8514988}

  /* ── 顶部栏 ── */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:46px;display:flex;
    align-items:center;gap:14px;padding:0 16px;background:var(--panel);
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  #topbar .title{font-size:15px;font-weight:600;letter-spacing:1px}
  #topbar .sub{font-size:12px;color:var(--dim)}
  #status-pill{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;
    padding:3px 12px;border-radius:12px;border:1px solid var(--line);color:var(--dim)}
  #status-pill.info{color:var(--acc);border-color:var(--acc)}
  #status-pill.ok{color:var(--ok);border-color:var(--ok)}
  #status-pill.warn{color:var(--warn);border-color:var(--warn)}
  #status-pill.alarm{color:#fff;background:var(--alarm);border-color:var(--alarm);
    animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.55}}
  #conn-dot{width:8px;height:8px;border-radius:50%;background:#555}
  #conn-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}

  /* ── 左上工具条 ── */
  #tools{position:fixed;top:58px;left:16px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);cursor:pointer;
    padding:6px 14px;border-radius:8px;font-size:12px;backdrop-filter:blur(8px);transition:.15s}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.primary{background:#1f6feb33;border-color:var(--acc)}
  .btn.danger{background:#f8514922;border-color:var(--alarm)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ── 右侧事件日志 ── */
  #log{position:fixed;right:16px;top:58px;z-index:20;width:270px;max-height:46vh;
    overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px;font-size:12px;backdrop-filter:blur(8px)}
  #log h4{font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
  #log .item{padding:3px 0;border-bottom:1px dashed #ffffff14;color:var(--dim);word-break:break-all}
  #log .item.alarm{color:var(--alarm)}
  #log .item.warn{color:var(--warn)}
  #log .item.ok{color:var(--ok)}
  #log .item.sdk{color:#79c0ff;font-family:Consolas,monospace;font-size:11px}

  /* ── 任务段演示面板 ── */
  #segPanel{position:fixed;left:16px;bottom:16px;z-index:20;width:250px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;backdrop-filter:blur(8px)}
  #segPanel h4{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:6px}
  #segPanel select{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:4px 6px;font-size:12px;margin-bottom:6px}
  #segBtns{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
  #segBtns .btn{text-align:left;font-size:11px;padding:4px 10px}

  /* ── 关节调试面板 ── */
  #jointPanel{position:fixed;right:16px;bottom:16px;z-index:20;width:270px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:none;
    backdrop-filter:blur(8px)}
  #jointPanel.show{display:block}
  #jointPanel h4{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:6px}
  #jointRows{max-height:46vh;overflow-y:auto}
  #jointPanel .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #jointPanel .row label{width:110px;color:var(--dim);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #jointPanel .row input[type=range]{flex:1}
  #jointPanel .row .val{width:38px;text-align:right;color:var(--acc)}
  #jointPanel textarea{width:100%;height:52px;margin-top:6px;background:#0d1117;color:var(--ok);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="topbar">
  <span class="title">陪一把 · 数字孪生演示</span>
  <span class="sub">养老陪伴机器人 Galbot G1 ｜ 虚拟居家场景</span>
  <a class="btn" href="./lab.html" style="text-decoration:none">动作调试台 →</a>
  <div id="status-pill">待命</div>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">
    <div id="conn-dot"></div><span id="conn-text">未连接</span>
  </div>
</div>

<div id="tools">
  <button class="btn primary" id="btnDemo">▶ 演示选中任务（左下面板选）</button>
  <button class="btn" id="btnFollow">双人跟随 开</button>
  <button class="btn" id="btnView">切换 顶视图</button>
  <button class="btn" id="btnRotate">自动旋转 开</button>
  <button class="btn" id="btnTags">标注 开</button>
  <button class="btn" id="btnJoints">关节调试</button>
  <button class="btn danger" id="btnReset">场景复位</button>
</div>

<div id="log"><h4>事件日志</h4><div id="logList"></div></div>

<div id="segPanel">
  <h4>任务演示（① 单段 ② 整链 ③ 全部连跑）</h4>
  <select id="chainSel"></select>
  <div id="segBtns"></div>
  <button class="btn" id="btnRunAll" style="width:100%;margin-top:6px">▶▶ 全部任务连跑</button>
</div>

<div id="jointPanel">
  <h4>关节调试（度）— 调好后复制 JSON 给 Python 用</h4>
  <div id="jointRows"></div>
  <textarea id="jointJson" readonly></textarea>
</div>

<script type="importmap">
{ "imports": {
    "three": "./lib/three.module.min.js",
    "three/addons/": "./lib/addons/"
} }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
